[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vggt-aura"
version = "0.0.1"
description = "Stratified failure analysis of the released VGGT-Omega checkpoint on FZI-AURA driving data."
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = ["numpy", "pandas", "pyarrow"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "pillow", "pybind11"]   # matplotlib and pillow for the picture tests, pybind11 to build cpp/

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
